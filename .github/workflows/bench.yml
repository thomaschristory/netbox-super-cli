name: bench

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - name: Install
        run: uv sync --all-extras --dev
      - name: Benchmark
        run: NSC_BENCH=1 uv run pytest tests/benchmarks/ -v -s
        continue-on-error: true
      - name: Step summary
        if: always()
        run: |
          echo "Bench job ran. See the previous step's stdout for the median timing." >> "$GITHUB_STEP_SUMMARY"
